name: .NET CI and Windows Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mg-business-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK information
        run: dotnet --info

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Restore, build, test and publish
        shell: pwsh
        run: ./scripts/publish-win-x64.ps1

      - name: Verify installer artifact exists
        shell: pwsh
        run: |
          if (-not (Test-Path "artifacts/installer/MG-Business-Platform-Setup-win-x64.exe")) {
            throw "Installer EXE was not produced."
          }
          if (-not (Test-Path "artifacts/installer/MG-Business-Platform-Setup-win-x64.exe.sha256")) {
            throw "Main installer SHA-256 checksum was not produced."
          }
          if (-not (Test-Path "artifacts/MG-Business-Platform-win-x64.zip")) {
            throw "Portable ZIP package was not produced."
          }
          if (-not (Test-Path "artifacts/publish/license-tool/MG.BusinessPlatform.LicenseManager.exe")) {
            throw "Graphical license manager executable was not produced."
          }
          if (-not (Test-Path "artifacts/publish/license-tool/MG.BusinessPlatform.LicenseTool.exe")) {
            throw "License manager CLI executable was not produced."
          }
          if (-not (Test-Path "artifacts/MG-License-Manager-win-x64.zip")) {
            throw "Separate license manager ZIP package was not produced."
          }
          if (-not (Test-Path "artifacts/MG-Business-Platform-SOURCE.zip")) {
            throw "Main source ZIP package was not produced."
          }
          if (-not (Test-Path "artifacts/MG-License-Manager-SOURCE.zip")) {
            throw "Separate license manager source ZIP package was not produced."
          }
          if (-not (Test-Path "artifacts/MG-Business-Platform-SOURCE.zip.sha256")) {
            throw "Main source ZIP checksum was not produced."
          }
          if (-not (Test-Path "artifacts/MG-License-Manager-SOURCE.zip.sha256")) {
            throw "License manager source ZIP checksum was not produced."
          }
          if (-not (Test-Path "artifacts/installer/MG-License-Manager-Setup-win-x64.exe")) {
            throw "Separate license manager installer EXE was not produced."
          }
          if (-not (Test-Path "artifacts/installer/MG-License-Manager-Setup-win-x64.exe.sha256")) {
            throw "License manager installer SHA-256 checksum was not produced."
          }

      - name: Upload main application installer
        uses: actions/upload-artifact@v4
        with:
          name: MG-Business-Platform-Installer-win-x64
          if-no-files-found: error
          path: |
            artifacts/installer/MG-Business-Platform-Setup-win-x64.exe
            artifacts/installer/MG-Business-Platform-Setup-win-x64.exe.sha256

      - name: Upload main portable package
        uses: actions/upload-artifact@v4
        with:
          name: MG-Business-Platform-Portable-win-x64
          if-no-files-found: error
          path: |
            artifacts/MG-Business-Platform-win-x64.zip
            artifacts/MG-Business-Platform-win-x64.zip.sha256

      - name: Upload separate license manager installer
        uses: actions/upload-artifact@v4
        with:
          name: MG-License-Manager-Installer-win-x64
          if-no-files-found: error
          path: |
            artifacts/installer/MG-License-Manager-Setup-win-x64.exe
            artifacts/installer/MG-License-Manager-Setup-win-x64.exe.sha256

      - name: Upload separate license manager portable package
        uses: actions/upload-artifact@v4
        with:
          name: MG-License-Manager-Portable-win-x64
          if-no-files-found: error
          path: |
            artifacts/MG-License-Manager-win-x64.zip
            artifacts/MG-License-Manager-win-x64.zip.sha256

      - name: Upload main source archive
        uses: actions/upload-artifact@v4
        with:
          name: MG-Business-Platform-SOURCE
          if-no-files-found: error
          path: |
            artifacts/MG-Business-Platform-SOURCE.zip
            artifacts/MG-Business-Platform-SOURCE.zip.sha256

      - name: Upload separate license manager source archive
        uses: actions/upload-artifact@v4
        with:
          name: MG-License-Manager-SOURCE
          if-no-files-found: error
          path: |
            artifacts/MG-License-Manager-SOURCE.zip
            artifacts/MG-License-Manager-SOURCE.zip.sha256
