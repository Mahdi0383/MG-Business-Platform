name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK information
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore MG.BusinessPlatform.sln

      - name: Build solution
        run: dotnet build MG.BusinessPlatform.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test MG.BusinessPlatform.sln --configuration Release --no-build --logger "console;verbosity=normal"
