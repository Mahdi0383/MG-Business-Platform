name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-domain:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK information
        run: dotnet --info

      - name: Build domain project
        run: dotnet build src/MG.BusinessPlatform.Domain/MG.BusinessPlatform.Domain.csproj --configuration Release
