name: MG tenant provisioning safety tests

on:
  pull_request:
    paths:
      - 'backend/tenant-database/**'
      - 'backend/database/migrations/**'
      - 'backend/src/Mg.Platform.Api/Provisioning/**'
      - 'backend/src/Mg.Platform.Api/Secrets/**'
      - 'backend/src/Mg.Provisioning.Agent.Core/**'
      - 'backend/src/Mg.Provisioning.Agent.Api/**'
      - 'backend/docs/PROVISIONING_AGENT_CONTRACT.md'
      - 'backend/docs/PROVISIONING_AGENT_OPERATIONS_ACCEPTANCE.md'
      - 'backend/tests/Mg.Platform.Api.Tests/**'
      - 'backend/tests/scripts/enable-postgres-tls.sh'
      - '.github/workflows/tenant-provisioning-tests.yml'
  push:
    branches: [main, 'feature/mg-business-web-foundation', 'feature/mg-provisioning-job-leases']
    paths:
      - 'backend/tenant-database/**'
      - 'backend/database/migrations/**'
      - 'backend/src/Mg.Platform.Api/Provisioning/**'
      - 'backend/src/Mg.Platform.Api/Secrets/**'
      - 'backend/src/Mg.Provisioning.Agent.Core/**'
      - 'backend/src/Mg.Provisioning.Agent.Api/**'
      - 'backend/docs/PROVISIONING_AGENT_CONTRACT.md'
      - 'backend/tests/Mg.Platform.Api.Tests/**'
      - '.github/workflows/tenant-provisioning-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mg-tenant-provisioning-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mg-ci-test-only
          POSTGRES_DB: mg_platform_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mg_platform_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MG_TEST_POSTGRES: Host=localhost;Port=5432;Database=mg_platform_tests;Username=postgres;Password=mg-ci-test-only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.x
      - name: Enable PostgreSQL TLS for strict certificate validation tests
        run: bash backend/tests/scripts/enable-postgres-tls.sh
      - name: Start disposable Vault KV v2 test server
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vault-tls"
          chmod 777 "$RUNNER_TEMP/vault-tls"
          docker run --detach --name mg-vault-ci --publish 8200:8200 \\
            --volume "$RUNNER_TEMP/vault-tls:/vault/tls" \\
            hashicorp/vault:2.2.2@sha256:18c03dcc5589b1a67eb3c7bd74d6982747f0d835a285516b87e3992f085de5a4 \\
            server -dev -dev-root-token-id=mg-ci-vault-token -dev-tls \\
            -dev-tls-cert-dir=/vault/tls -dev-listen-address=0.0.0.0:8200
          for attempt in $(seq 1 60); do
            if [[ -s "$RUNNER_TEMP/vault-tls/vault-ca.pem" ]] && \\
              curl --silent --show-error --fail \\
                --cacert "$RUNNER_TEMP/vault-tls/vault-ca.pem" \\
                --header "X-Vault-Token: mg-ci-vault-token" \\
                https://127.0.0.1:8200/v1/sys/health >/dev/null; then
              break
            fi
            sleep 1
          done
          if [[ ! -s "$RUNNER_TEMP/vault-tls/vault-ca.pem" ]] || ! \\
            curl --silent --show-error --fail \\
              --cacert "$RUNNER_TEMP/vault-tls/vault-ca.pem" \\
              --header "X-Vault-Token: mg-ci-vault-token" \\
              https://127.0.0.1:8200/v1/sys/health >/dev/null; then
            docker logs mg-vault-ci
            exit 1
          fi
          {
            echo "MG_TEST_VAULT_ADDRESS=https://127.0.0.1:8200"
            echo "MG_TEST_VAULT_TOKEN=mg-ci-vault-token"
            echo "MG_TEST_VAULT_CA_CERT=$RUNNER_TEMP/vault-tls/vault-ca.pem"
          } >> "$GITHUB_ENV"
      - name: Run provisioning and tenant schema integration tests
        run: dotnet test backend/tests/Mg.Platform.Api.Tests/Mg.Platform.Api.Tests.csproj --configuration Release
      - name: Stop disposable Vault test server
        if: always()
        run: docker rm --force mg-vault-ci >/dev/null 2>&1 || true
