name: MG Business Web — build and GitHub Pages

on:
  push:
    branches: [main, 'feature/mg-business-web-foundation']
    paths:
      - 'web/**'
      - 'backend/**'
      - 'docker-compose.web.yml'
      - '.github/workflows/web-pages.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'backend/**'
      - 'docker-compose.web.yml'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

# Default to read-only. The deploy job receives Pages write and OIDC permissions
# only when it runs on the default branch.
permissions:
  contents: read

concurrency:
  # Keep runs isolated per PR/branch; a push event must not cancel its PR run.
  group: mg-business-web-pages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mg-ci-test-only
          POSTGRES_DB: mg_platform_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mg_platform_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MG_TEST_POSTGRES: Host=localhost;Port=5432;Database=mg_platform_tests;Username=postgres;Password=mg-ci-test-only
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.x
      - name: Enable PostgreSQL TLS for strict certificate validation tests
        run: bash backend/tests/scripts/enable-postgres-tls.sh
      - name: Start disposable Vault KV v2 test server
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vault-tls"
          chmod 777 "$RUNNER_TEMP/vault-tls"
          docker run --detach --name mg-vault-ci --publish 8200:8200 \\
            --volume "$RUNNER_TEMP/vault-tls:/vault/tls" \\
            hashicorp/vault:2.2.2@sha256:18c03dcc5589b1a67eb3c7bd74d6982747f0d835a285516b87e3992f085de5a4 \\
            server -dev -dev-root-token-id=mg-ci-vault-token -dev-tls \\
            -dev-tls-cert-dir=/vault/tls -dev-listen-address=0.0.0.0:8200
          for attempt in $(seq 1 60); do
            if [[ -s "$RUNNER_TEMP/vault-tls/vault-ca.pem" ]] && \\
              curl --silent --show-error --fail \\
                --cacert "$RUNNER_TEMP/vault-tls/vault-ca.pem" \\
                --header "X-Vault-Token: mg-ci-vault-token" \\
                https://127.0.0.1:8200/v1/sys/health >/dev/null; then
              break
            fi
            sleep 1
          done
          if [[ ! -s "$RUNNER_TEMP/vault-tls/vault-ca.pem" ]] || ! \\
            curl --silent --show-error --fail \\
              --cacert "$RUNNER_TEMP/vault-tls/vault-ca.pem" \\
              --header "X-Vault-Token: mg-ci-vault-token" \\
              https://127.0.0.1:8200/v1/sys/health >/dev/null; then
            docker logs mg-vault-ci
            exit 1
          fi
          {
            echo "MG_TEST_VAULT_ADDRESS=https://127.0.0.1:8200"
            echo "MG_TEST_VAULT_TOKEN=mg-ci-vault-token"
            echo "MG_TEST_VAULT_CA_CERT=$RUNNER_TEMP/vault-tls/vault-ca.pem"
          } >> "$GITHUB_ENV"
      - name: Restore and build backend
        run: dotnet build backend/src/Mg.Platform.Api/Mg.Platform.Api.csproj --configuration Release
        working-directory: .
      - name: Build isolated provisioning agent API
        run: dotnet build backend/src/Mg.Provisioning.Agent.Api/Mg.Provisioning.Agent.Api.csproj --configuration Release
        working-directory: .
      - name: Run backend unit tests
        run: dotnet test backend/tests/Mg.Platform.Api.Tests/Mg.Platform.Api.Tests.csproj --configuration Release
        working-directory: .
      - name: Stop disposable Vault test server
        if: always()
        run: docker rm --force mg-vault-ci >/dev/null 2>&1 || true
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
        working-directory: web
      - name: Audit dependencies
        run: node scripts/audit-dependencies.mjs
        working-directory: web
      - name: Run frontend unit tests
        run: npm test
        working-directory: web
      - name: Build production bundle
        run: npm run build
        working-directory: web
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mg-business-web-dist
          path: |
            web/dist
            web/package-lock.json
          if-no-files-found: error
          retention-days: 14
      - name: Setup Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
