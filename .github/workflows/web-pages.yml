name: MG Business Web — build and GitHub Pages

on:
  push:
    branches: [main, 'feature/mg-business-web-foundation']
    paths:
      - 'web/**'
      - 'backend/**'
      - 'docker-compose.web.yml'
      - '.github/workflows/web-pages.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'backend/**'
      - 'docker-compose.web.yml'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

# Default to read-only. The deploy job receives Pages write and OIDC permissions
# only when it runs on the default branch.
permissions:
  contents: read

concurrency:
  # Keep runs isolated per PR/branch; a push event must not cancel its PR run.
  group: mg-business-web-pages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mg-ci-test-only
          POSTGRES_DB: mg_platform_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mg_platform_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MG_TEST_POSTGRES: Host=localhost;Port=5432;Database=mg_platform_tests;Username=postgres;Password=mg-ci-test-only
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore and build backend
        run: dotnet build backend/src/Mg.Platform.Api/Mg.Platform.Api.csproj --configuration Release
        working-directory: .
      - name: Build isolated provisioning agent API
        run: dotnet build backend/src/Mg.Provisioning.Agent.Api/Mg.Provisioning.Agent.Api.csproj --configuration Release
        working-directory: .
      - name: Run backend unit tests
        run: dotnet test backend/tests/Mg.Platform.Api.Tests/Mg.Platform.Api.Tests.csproj --configuration Release
        working-directory: .
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
        working-directory: web
      - name: Audit dependencies
        run: node scripts/audit-dependencies.mjs
        working-directory: web
      - name: Run frontend unit tests
        run: npm test
        working-directory: web
      - name: Build production bundle
        run: npm run build
        working-directory: web
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mg-business-web-dist
          path: |
            web/dist
            web/package-lock.json
          if-no-files-found: error
          retention-days: 14
      - name: Setup Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
