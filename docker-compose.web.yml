services:
  mg-platform-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mg_platform
      POSTGRES_USER: mg_platform
      POSTGRES_PASSWORD: ${MG_PLATFORM_DB_PASSWORD:?Set MG_PLATFORM_DB_PASSWORD in the environment}
    volumes:
      - mg-platform-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mg_platform -d mg_platform"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mg-platform-api:
    build:
      context: ./backend
      dockerfile: src/Mg.Platform.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Platform: Host=mg-platform-db;Port=5432;Database=mg_platform;Username=mg_platform;Password=${MG_PLATFORM_DB_PASSWORD:?Set MG_PLATFORM_DB_PASSWORD in the environment}
      Authentication__Authority: ${MG_OIDC_AUTHORITY:?Set MG_OIDC_AUTHORITY to an HTTPS OIDC issuer URL}
      Authentication__Audience: ${MG_OIDC_AUDIENCE:?Set MG_OIDC_AUDIENCE for the MG Platform API}
      Secrets__Vault__Address: ${MG_VAULT_ADDRESS:-}
      Secrets__Vault__Token: ${MG_VAULT_TOKEN:-}
      Secrets__Vault__Mount: ${MG_VAULT_MOUNT:-secret}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      mg-platform-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mg-platform-db-data:
